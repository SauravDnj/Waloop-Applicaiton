# nginx server block for the web app (dist/ copied to /var/www/dialerapp).
# Put TLS (listen 443 ssl; ssl_certificate …) in front as usual.
server {
    listen 80;
    server_name dialerapp.com.bot;
    root /var/www/dialerapp;
    index index.html;

    # Pages with an id in the address: a real file wins (e.g. /campaigns/new), else the page template.
    location ~ ^/lead/[^/]+/?$              { try_files $uri.html /lead/[id].html =404; }
    location ~ ^/chat/[^/]+/?$              { try_files $uri.html /chat/[id].html =404; }
    location ~ ^/board/[^/]+/?$             { try_files $uri.html /board/[slug].html =404; }
    location ~ ^/campaigns/[^/]+/?$         { try_files $uri.html /campaigns/[id].html =404; }
    location ~ ^/channels/[^/]+/?$          { try_files $uri.html /channels/[id].html =404; }
    location ~ ^/whatsapp/channel/[^/]+/?$  { try_files $uri.html /whatsapp/channel/[id].html =404; }

    # Hashed scripts and assets never change.
    location /_expo/ { expires 1y; add_header Cache-Control "public, immutable"; try_files $uri =404; }

    # Everything else: the file, or its clean URL (/contacts → contacts.html).
    location / { try_files $uri $uri.html $uri/index.html =404; }

    error_page 404 /404.html;
}
